<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>音蔵 — Otogura</title>
<style>
  :root {
    --bg: #ffffff; --sub: #f8f9fa; --line: #e5e7eb;
    --text: #1a1a1a; --dim: #6b7280; --accent: #7c3aed; --accent-bg: #ede9fe;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif; font-size: 13px;
    user-select: none;
  }

  /* 上部: 再生中の情報（指示書: ウィンドウの上部に表示） */
  #now {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--sub);
    flex: 0 0 auto;
  }
  /* 大きさは指示書に無かったので相談して 80x80 に決めた（2026-08-24） */
  #art {
    width: 80px; height: 80px; flex: 0 0 auto; border-radius: 4px;
    background: #e5e7eb center/cover no-repeat;
  }

  /* 再生リスト内のドラッグ＆ドロップ並べ替え（ライブラリ側は並べ替えない） */
  tr.dragging td { opacity: .35; }
  tr.dropzone td { box-shadow: inset 0 2px 0 0 var(--accent); }
  td.grip { width: 26px; text-align: center; color: #d1d5db; cursor: grab; }
  tr:hover td.grip { color: var(--accent); }

  #meta { flex: 1; min-width: 0; }
  #title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub   { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  #seek { flex: 1; }
  /* 「ほかに N 件あります」の行。数字だけ出して黙らないため */
  .more { color: #6b7280; font-size: 12px; padding: 8px 10px; font-style: normal; }
  li.more { cursor: default; background: #fafafa; }
  /* 音量のつまみ。長さを決めておかないと、席取り合戦で seek が潰れる */
  #volwrap { display: inline-flex; align-items: center; gap: 4px; flex: none; }
  #vol { width: 90px; }
  #volicon { font-size: 13px; width: 18px; text-align: center; }
  .btn.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  td.plays { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; width: 52px; font-size: 11px; }
  #time { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
  .btn {
    border: 1px solid var(--line); background: #fff; border-radius: 4px;
    padding: 6px 12px; cursor: pointer; font-size: 12px; color: var(--text);
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { color: #d1d5db; cursor: default; border-color: var(--line); }

  /* 3カラム（絞り込み） */
  /* ★min-height:0 が無いと、中身の多い列が 240px に収まらず下まで伸び、
     その下の曲一覧が画面外へ押し出される（68アーティストで発覚。4曲では出なかった）*/
  #cols { display: flex; flex: 0 0 240px; min-height: 0; }
  /* 3カラムの中身を切り替えるタブ */
  #coltabs { display: flex; gap: 4px; padding: 4px 8px 0; background: var(--sub); border-bottom: 1px solid var(--line); }
  #coltabs button {
    font: inherit; font-size: 12px; padding: 4px 12px; cursor: pointer;
    border: 1px solid var(--line); border-bottom: none; background: transparent;
    color: var(--dim); border-radius: 4px 4px 0 0;
  }
  #coltabs button:hover { background: #fff; }
  #coltabs button.on { background: #fff; color: var(--accent); font-weight: 600; }
  /* ★隠れているタブに絞り込みが残っていることを出す（出さないと理由が分からない） */
  #coltabs button .mark { color: var(--accent); font-weight: 700; margin-left: 4px; }
  /* 気分の欄。キーがあるときだけ出す */
  #aibar { display: none; gap: 6px; align-items: center; padding: 6px 8px; background: var(--sub); border-bottom: 1px solid var(--line); }
  #aibar.on { display: flex; }
  #aibar input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; }
  #aibar .said { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
  /* ★つまみ（対象の幅・選出の量）は 2 段目。1 行に並べると記入欄が押しつぶされる */
  #aibar.on { flex-wrap: wrap; }
  #aibar .knobs { flex-basis: 100%; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); }
  /* 上の #aibar input が flex:1 なので、つまみだけ幅を決め直す */
  #aibar .knobs input[type=range] { flex: 0 0 96px; min-width: 96px; padding: 0; border: 0; }
  /*
   * ★つまみの左端と現在値（2026-08-30 本人の希望）。
   * 前は名前（「対象の幅」など）を置いていて、幅が足りず 2 行に折り返していた。
   * 短い言葉に替えたうえで、念のため折り返しも止める。
   */
  #aibar .knobs .val { min-width: 4.5em; color: var(--text); white-space: nowrap; }
  #aibar .knobs .edge { white-space: nowrap; color: var(--dim); }
  /* つまみの左右に少しだけ間を空ける（隣の組とくっつかないように） */
  #aibar .knobs .val + .edge { margin-left: 10px; }
  /* ★拡大解釈の入／切（2026-08-30）。強度とは別の軸 */
  #aiwide2 { flex: 0 0 auto; }
  #aiwide2.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #aibar .knobs .said { max-width: none; flex: 1; }
  /* ★いま何から組むのか。押す前に見えるところに置く */
  /*
   * ★あとから足した「整える」道具は、たたんでおく（2026-08-30 本人の希望）。
   *   > ボタンが多くてAIの指示欄をあっぱくしてるのでべつのどこかにまとめたいです。
   *   > 一度使ったらあまり使わない機能なので
   */
  /*
   * ★打った文の履歴（2026-08-30 本人の希望）。
   * 欄をクリックすると、下に出る。
   */
  #aibar { position: relative; }
  .histbox { position: absolute; z-index: 40; background: #fff;
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px #0002;
    max-height: 46vh; overflow-y: auto; min-width: 260px; max-width: 560px; padding: 4px 0; }
  .histbox .row { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 12px;
    font-size: 12px; cursor: pointer; }
  .histbox .row:hover { background: var(--accent-bg); }
  .histbox .row .txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .histbox .row .del { color: var(--dim); padding: 0 4px; border-radius: 4px; }
  .histbox .row .del:hover { background: #0001; color: var(--text); }
  .histbox .foot { border-top: 1px solid var(--line); margin-top: 4px; padding: 6px 12px;
    font-size: 12px; color: var(--dim); cursor: pointer; }
  .histbox .foot:hover { background: var(--accent-bg); color: var(--text); }
  #aibar .tools { flex-basis: 100%; display: none; gap: 8px; flex-wrap: wrap;
    align-items: center; padding: 6px 2px 0; border-top: 1px dashed var(--line); }
  #aibar .tools.on { display: flex; }
  #aibar .toolsbtn { margin-left: auto; }
  /* ★走っている間だけ出る「止める」（2026-08-30） */
  #aistop { display: none; border-color: #b45309; color: #b45309; }
  #aistop.on { display: inline-block; }
  #aistop:hover { background: #fef3c7; }
  #aibar .scope { flex-basis: 100%; font-size: 12px; color: var(--dim); padding: 2px 2px 0; }
  #aibar .scope .b { color: var(--accent); font-weight: 600; }
  #aibar .scope .warn { color: #b45309; }
  /* Resonance（Kokoro OS の木）。読み込んだときだけ出す */
  #resbar { display: none; gap: 6px; align-items: center; flex-wrap: wrap; padding: 5px 8px; background: var(--sub); border-bottom: 1px solid var(--line); }
  #resbar.on { display: flex; }
  #resbar .said { color: var(--dim); font-size: 12px; }
  #resbar .restag {
    font: inherit; font-size: 11px; padding: 2px 8px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--accent);
  }
  #resbar .restag:hover { background: var(--accent-bg); }
  /*
   * ★辿った言葉は「札 1 個」に見せる（2026-08-29 本人の指摘）。
   *   > resonanceでできた項目の選択や編集の選択部分のデザインが少し煩雑
   * 前は［言葉］［✎］［×］が**別々の丸**で、言葉 3 つで丸が 9 個並んでいた。
   * 1 つのものなのに 3 つに見えるのが、ごちゃついて見える正体だった。
   * 中に畳んで、触れたときだけ ✎ と × を濃くする。
   */
  #resbar .resword {
    display: inline-flex; align-items: center; gap: 2px;
    border: 1px solid var(--line); border-radius: 999px;
    background: #fff; padding: 1px 4px 1px 10px; font-size: 11px; color: var(--accent);
  }
  #resbar .resword:hover { background: var(--accent-bg); }
  #resbar .resword .resnum { color: var(--dim); margin-left: 4px; font-variant-numeric: tabular-nums; }
  #resbar .resword button {
    font: inherit; font-size: 11px; line-height: 1; cursor: pointer;
    border: 0; background: none; color: var(--dim); padding: 3px 4px; border-radius: 999px;
  }
  #resbar .resword button:hover { color: var(--accent); background: #fff; }
  #resbar .resword .del:hover { color: #b91c1c; }
  /* ★確かめる候補（手元で見つからなかった名前）。開いたときだけ 2 段目に出す */
  #resbar .misslist { flex-basis: 100%; max-height: 190px; overflow-y: auto;
    margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); }
  #resbar .misshead { font-size: 11px; color: var(--dim); line-height: 1.6; padding: 0 2px 6px; }
  #resbar .missrow { display: flex; gap: 8px; align-items: baseline; padding: 2px; font-size: 12px; }
  #resbar .missdepth { color: var(--dim); font-size: 11px; min-width: 3.8em; flex: 0 0 auto; }
  #resbar .missname { color: var(--text); flex: 0 0 auto; }
  #resbar .misslist .said { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 3カラムの高さを掴んで変える取っ手。細いと掴めないので、少し余裕をとる */
  #colsizer { flex: 0 0 6px; cursor: row-resize; background: var(--line); }
  #colsizer:hover { background: var(--accent); }
  .col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .col:last-child { border-right: none; }
  .col h2 {
    margin: 0; padding: 6px 10px; font-size: 10px; letter-spacing: .12em;
    color: var(--dim); background: var(--sub); border-bottom: 1px solid var(--line);
    font-weight: 600; text-transform: uppercase;
  }
  .col ul { margin: 0; padding: 0; list-style: none; overflow-y: auto; flex: 1; min-height: 0; }
  .col li { padding: 5px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col li:hover { background: var(--sub); }
  .col li.on { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
  /* 列の中を打ち込んで探す欄。件数が多い列にだけ出す */
  /* 探す欄。スクロールしても上に残す（下へ流れると使えない） */
  li.findrow { position: sticky; top: 0; background: #fff; padding: 0; cursor: default; z-index: 1; border-bottom: 1px solid var(--line); }
  li.findrow:hover { background: #fff; }
  .colfind { width: calc(100% - 12px); margin: 5px 6px; padding: 4px 7px; border: 1px solid var(--line); border-radius: 4px; font-size: 11px; outline: none; }
  .colfind:focus { border-color: var(--accent); }

  /* 下: 曲一覧（再生する場所） */
  #list { flex: 1; min-height: 0; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    position: sticky; top: 0; background: var(--sub); text-align: left;
    font-size: 10px; letter-spacing: .1em; color: var(--dim); text-transform: uppercase;
    padding: 6px 10px; border-bottom: 1px solid var(--line); font-weight: 600;
  }
  th { position: relative; }
  .resizer { position: absolute; right: 0; top: 0; width: 6px; height: 100%; cursor: col-resize; }
  .resizer:hover { background: var(--accent); opacity: .5; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--accent); }
  th.sorted { color: var(--accent); }
  td { padding: 5px 10px; border-bottom: 1px solid #f3f4f6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tr { cursor: default; }
  tr:hover td { background: var(--sub); }
  tr.playing td { background: var(--accent-bg); color: var(--accent); }
  /* シャッフルから外してある曲。一覧には残り、押せば鳴る（薄く見せるだけ） */
  tr.skip td { opacity: .5; }
  tr.skip td.title::before { content: '🚫 '; opacity: .8; }
  /*
   * ★自分の音源（2026-08-30）。**一覧には残す。押せば鳴る。**
   * くじと AI の候補に入らないだけなので、消えたようには見せない。
   */
  tr.mine td { opacity: .72; }
  tr.mine td.title::before { content: '✎ '; opacity: .85; }
  /*
   * ★手直しで入れたジャンルの曲（2026-08-30）。手直し.json を消せば戻る。
   * ★一覧に「ジャンル」の列は無い（ジャンルは上のカラムだけ）ので、
   * 曲名の**後ろ**に出す。前は skip と mine が使っている。
   */
  tr.naoshi td.title::after { content: ' ✚'; color: var(--accent); opacity: .8; }
  td.play-cell { color: var(--accent); text-align: center; cursor: pointer; }
  td.num { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; width: 48px; }
  td.dur { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; width: 64px; }
  td.act { text-align: right; }   /* 幅は colgroup 側で決める（既定の列幅）。ここに書くと二重管理になる */
  .link { color: var(--dim); font-size: 11px; cursor: pointer; text-decoration: underline; }
  .link:hover { color: var(--accent); }

  /*
   * ★画面の中の確認欄（2026-08-29）。
   * OS のダイアログ（confirm / alert）は、閉じたあと**窓の焦点が戻らない。**
   * 見た目は打てそうなのにキーが届かない、という分かりにくい壊れ方になる。
   * Windows は「裏の窓が勝手に前へ出る」のを止めるので、
   * こちらから焦点を戻すこともできなかった（実測）。
   * ★だから OS に出さない。画面の中で訊く。prompt() のときと同じ答え。
   */
  #ask { position: fixed; inset: 0; display: none; z-index: 50;
    background: rgba(0, 0, 0, .28); align-items: center; justify-content: center; }
  #ask.on { display: flex; }
  #ask .box { background: #fff; border-radius: 10px; border: 1px solid var(--line);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .22); padding: 18px 20px;
    max-width: min(560px, 86vw); max-height: 76vh; display: flex; flex-direction: column; gap: 14px; }
  #ask .msg { font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-y: auto; }
  #ask .row { display: flex; gap: 8px; justify-content: flex-end; }
  #ask button { font: inherit; font-size: 12px; padding: 6px 16px; border-radius: 6px;
    border: 1px solid var(--line); background: #fff; cursor: pointer; }
  #ask button.main { background: var(--accent); border-color: var(--accent); color: #fff; }
  #ask button:hover { filter: brightness(.97); }
  /* ★ジャンルのまとめを見てもらうところ（2026-08-30） */
  #ask .box.wide { max-width: 780px; width: 92vw; }
  #ask .groups { text-align: left; font-size: 12px; overflow-y: auto; max-height: 52vh;
    border: 1px solid var(--line); border-radius: 6px; }
  #ask .groups label { display: block; padding: 7px 10px; border-bottom: 1px solid var(--line);
    cursor: pointer; line-height: 1.6; }
  #ask .groups label:last-child { border-bottom: 0; }
  #ask .groups label:hover { background: var(--accent-bg); }
  #ask .groups .oya { font-weight: 600; }
  #ask .groups .kazu { color: var(--dim); }
  #ask .groups .ko { color: var(--dim); display: block; padding-left: 22px; }
  #ask .groups .wake { color: var(--dim); display: block; padding-left: 22px; font-style: italic; }

  /* 下端: フォルダ設定と状態 */
  #foot {
    flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--sub);
    padding: 8px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #folders { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
  .chip {
    background: #fff; border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 8px; font-size: 11px; color: var(--dim);
    display: inline-flex; align-items: center; gap: 6px; max-width: 380px;
  }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip b { cursor: pointer; color: #9ca3af; font-weight: 400; }
  .chip b:hover { color: #b91c1c; }
  /*
   * ★状態は、いつも自分の行に置く（2026-08-29 本人の指摘）。
   *   > 下の欄のライブラリのところと下の欄の右のインフォが重なる
   * フォルダの札は数も長さもまちまちなので、同じ行に並べると押し合う。
   * ★短く切らずに、行を分ける。状態には「フォルダが登録されていません」のような
   * 大事な文が出るので、「…」で消えるほうが困る。
   */
  #status { flex-basis: 100%; min-width: 0; color: var(--dim); font-size: 11px; line-height: 1.6; }
  /*
   * ★再生リストは左に縦（2026-08-29 本人の希望）。
   *   > プレイリストを作るのが楽しくなって大量生産してしまい、
   *   > 今の表示部分だと無理があることがわかりました。
   * 横一列だと、増えたぶんが右へ流れて見えなくなる。縦なら何本でも並ぶ。
   */
  #lower { display: flex; flex: 1; min-height: 0; }
  /*
   * ★名前は潰さず、横に送る（2026-08-30 本人の指摘）:
   *   > 音蔵の表示幅を狭めてプレイリストのエリアが狭まると
   *   > プレイリストのタイトルが潰れるのでタイトルは狭めずスクロールするように
   *
   * 幅に合わせて縮めると、名前の頭だけが並んで**どれがどれか分からなくなる。**
   * 縦にも横にも送れるようにして、名前は元の長さのまま置く。
   */
  #tabs {
    flex: 0 0 auto; width: 170px; min-width: 120px; max-width: 420px;
    display: flex; flex-direction: column; gap: 2px; align-items: stretch;
    padding: 6px; border-right: 1px solid var(--line);
    overflow: auto; background: var(--sub);
  }
  /* ★縮ませない。縮むと名前が切れる */
  #tabs > * { flex: 0 0 auto; }
  #sidesizer { flex: 0 0 5px; cursor: col-resize; background: var(--line); }
  #sidesizer:hover { background: var(--accent); }
  #listwrap { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .tab {
    border: 1px solid transparent; background: none; border-radius: 6px;
    padding: 5px 9px; font-size: 12px; cursor: pointer; text-align: left;
    /* ★「…」で切らない。切ると、頭だけ同じ名前が見分けられない */
    white-space: nowrap; overflow: visible; text-overflow: clip; color: var(--text);
    /* ★枠も名前ぶんの幅にする。狭いままだと、色や下線が名前の途中で切れる */
    min-width: max-content;
  }
  .tab:hover { background: #fff; border-color: var(--line); }
  .tab.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  /* 見出しと、作る・読み込むのところ */
  #tabs .sidehead { font-size: 10px; color: var(--dim); padding: 6px 9px 2px; letter-spacing: .08em; }
  #tabs .sidefind {
    font: inherit; font-size: 11px; padding: 4px 8px; margin: 2px 0 4px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
    /* ★横に送っても、探す欄は見えている幅のまま（名前ぶんに伸ばさない） */
    width: auto; align-self: stretch; position: sticky; left: 0;
  }
  #tabs .sideadd { color: var(--dim); }
  #tabs .sideadd:hover { color: var(--accent); }
  #listtools { flex: 0 0 auto; display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--sub); flex-wrap: wrap; }
  #listtools:empty { display: none; }
  td.pick { width: 34px; text-align: center; }
  td.move { width: 62px; text-align: right; white-space: nowrap; }
  .mini { border: 1px solid var(--line); background: #fff; border-radius: 3px; font-size: 11px; padding: 1px 5px; cursor: pointer; color: var(--dim); }
  .mini:hover { border-color: var(--accent); color: var(--accent); }
  .mini:disabled { color: #e5e7eb; cursor: default; }
  .empty { padding: 40px 20px; text-align: center; color: var(--dim); line-height: 2; }
</style>
</head>
<body>

<div id="now">
  <div id="art"></div>
  <div id="meta">
    <div id="title">曲を選んでください</div>
    <div id="sub">&nbsp;</div>
    <div id="bar">
      <button class="btn" id="prev" title="前の曲" disabled>⏮</button>
      <button class="btn" id="play" disabled>▶</button>
      <button class="btn" id="next" title="次の曲" disabled>⏭</button>
      <button class="btn" id="repeat" title="繰り返し">🔁 しない</button>
      <button class="btn" id="shuffle" title="シャッフル">🔀 オフ</button>
      <button class="btn on" id="level" title="曲ごとの音量差をならす">🔊 音量そろえる</button>
      <!-- ★音量そのもののつまみ（本人の希望 2026-08-25）。
           「音量そろえる」は曲ごとの差をならすもので、全体の大きさは別物。 -->
      <span id="volwrap" title="音量">
        <span id="volicon">🔉</span>
        <input type="range" id="vol" value="100" min="0" max="100">
      </span>
      <input type="range" id="seek" value="0" min="0" max="1000" disabled>
      <span id="time">0:00 / 0:00</span>
    </div>
  </div>
</div>

<!-- ★3カラムに何を出すかを切り替えるタブ（本人の希望 2026-08-29）。
     切り替えても、前のタブの絞り込みは残す。だから隠れている側に
     絞り込みがあることを、タブ自身に出す。 -->
<div id="coltabs"></div>
<div id="aibar"></div>
<div id="resbar"></div>

<div id="cols">
  <div class="col"><h2>ジャンル</h2><ul id="c-genre"></ul></div>
  <div class="col"><h2>アーティスト</h2><ul id="c-artist"></ul></div>
  <div class="col"><h2>アルバム</h2><ul id="c-album"></ul></div>
</div>
<!-- ★3カラムの高さを、掴んで上下に変えられるようにする（本人の希望 2026-08-25）。
     列の幅は横に掴んで変えられるのに、高さだけ 240px で固定だった。 -->
<div id="colsizer" title="上下にドラッグして、3カラムの高さを変える"></div>

<!-- ★再生リストは左に縦に並べる（2026-08-29 本人の希望）。
     > プレイリストを作るのが楽しくなって大量生産してしまい、
     > 今の表示部分だと無理があることがわかりました。
     横に並べる作りだと、増えたぶん右へ流れて見えなくなっていた。 -->
<div id="lower">
  <div id="tabs"></div>
  <div id="sidesizer" title="左右にドラッグして、一覧の幅を変える"></div>
  <div id="listwrap">
<div id="listtools"></div>
<div id="list">
  <div class="empty" id="empty">
    下の「フォルダを追加」から、MP3 の入ったフォルダを選んでください。
  </div>
  <table id="table" style="display:none">
    <thead><tr><th class="num"></th><th>曲名</th><th>アーティスト</th><th>アルバム</th><th class="dur">長さ</th><th class="plays">再生</th><th class="act"></th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
  </div>
</div>

<div id="ask"><div class="box"><div class="msg"></div><div class="row"></div></div></div>
<div id="foot">
  <button class="btn" id="add">フォルダを追加</button>
  <button class="btn" id="rescan">再スキャン</button>
  <!-- ★言葉の切り替え（2026-08-30 本人の希望）。
       OS の言葉を見て自動で決めたうえで、手でも切り替えられる。
       たまにしか触らないので、下の欄に置く。 -->
  <button class="btn" id="langbtn" title="画面と AI の言葉を切り替えます">🌐 日本語</button>
  <!-- ★気分でおすすめ（本人の希望 2026-08-29）。
       このアプリで唯一、外に通信する機能。既定は切で、キーを入れるまで
       上の気分の欄は出ない。ここだけは、入れる道として常に出しておく。 -->
  <!-- ★「響きを読み込む」は封印（2026-08-29 本人の指示）。
       0.10.0 で音蔵の中から辿れるようになったので、公開版では表に出さない。
       読み込みの処理と JSON の形は残してある（README に形を載せてある）。
       Resonance が公開されたら、ここを戻すだけで繋がる。
       <button class="btn" id="resload" title="Kokoro OS の Resonance で書き出した JSON を読み込みます（読むだけ。音楽ファイルには触りません）">
       🌐 響きを読み込む
       </button>
  -->
  <!-- ★何のボタンか分かる名前にする（2026-08-29 本人の指摘）。
       > 下の欄の「気分で選ぶ」ボタンですが、今となっては何のボタンか
       > わからないのでAPIキーを登録するボタンだとちゃんと書いたほうがいい
       文字と説明は、キーが入っているかどうかで書き換える（キーのボタンを直す）。
       ここに書いてあるのは「まだ入れていない」ときの見た目。 -->
  <button class="btn" id="aikey" title="Anthropic の API キーを登録します。入れると、上に「気分を書く」欄と「言葉から辿る」欄が出ます">
    🔑 APIキーを入れる
  </button>
  <!-- ★タグの無い曲を隠す（本人の希望 2026-08-25）。
       理由: バンドで作った試作品が混ざっていて、再生したくない。
       以前は問答無用で消していたが、消えた理由が分からないほうが困るので選べるようにした。 -->
  <button class="btn on" id="untagged" title="曲名やアーティストの入っていない曲を、一覧にも出さず再生もしない">
    🏷 タグ無しを隠す
  </button>
  <!-- ★外したものを戻すボタン（2026-08-25）。
       「（「外したものを戻す」で戻せます）」と案内しておきながら、
       **その操作がどこにも無かった。** 一度外すと二度と戻せない状態だった。
       実際これで「足したのに読み込まれない」という報告になった
       （足し直したファイルが、前に外した道と同じだった）。
       外したものが 1 件も無いときは出さない。 -->
  <button class="btn" id="unhide" style="display:none" title="「一覧から外す」で外した曲を、すべて一覧に戻す"></button>
  <div id="folders"></div>
  <div id="status"></div>
</div>

<audio id="audio"></audio>
<script src="shuffle.js"></script>
<script src="lang.js"></script>
<script src="genre.js"></script>
<script src="naoshi.js"></script>
<script src="resonance.js"></script>
<script src="loudness.js"></script>
<script src="renderer.js"></script>
</body>
</html>
